<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servly</title>
    <!-- Tab icon: the round Servly mark, cropped from the brand logo -->
    <link rel="icon" type="image/png" href="/src/assets/servly-mark.png" />
    <!-- Installable app (PWA): manifest + theme colour for the Android address bar -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#04355e" />
    <!-- Fonts from the brand sheet: Montserrat (headings, numbers) + Inter (interface), plus DM Sans for Ace's loading caption. display=swap shows text immediately in a fallback font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
